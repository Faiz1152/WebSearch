<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings — WebSearch</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="settings" style="max-width:820px;margin:30px auto;padding:16px">
    <h1>Settings</h1>

    <section>
      <h2>Appearance</h2>
      <label><input type="radio" name="appearance" value="system"> System</label><br>
      <label><input type="radio" name="appearance" value="light"> Light</label><br>
      <label><input type="radio" name="appearance" value="dark"> Dark</label>
    </section>

    <section style="margin-top:16px">
      <h2>Search</h2>
      <label><input id="suggestionsToggle" type="checkbox"> Search suggestions</label><br>
      <label><input id="openNewToggle" type="checkbox"> Open results in new tab</label>
    </section>

    <section style="margin-top:16px">
      <h2>Backend</h2>
      <p>WebSearch frontend communicates only with your backend. Change if needed.</p>
      <input id="backendUrl" type="url" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ddd" placeholder="https://your-backend.workers.dev">
      <div style="margin-top:8px"><button id="saveBtn" class="submit-button">Save</button></div>
    </section>

    <section style="margin-top:24px">
      <a id="aboutLink" href="about.html">About WebSearch</a>
    </section>

    <section style="margin-top:24px;color:#666;font-size:13px">
      <p>Settings are stored locally in your browser.</p>
    </section>
  </main>

  <script>
    // load/save settings
    const appearance = localStorage.getItem('websearch-theme') || 'system';
    const openNew = localStorage.getItem('websearch-open-new') || 'on';
    const suggestionsOn = (localStorage.getItem('websearch-suggestions') || 'on') === 'on';
    const backend = localStorage.getItem('websearch-backend') || 'https://websearch-backend.khatrifaiz001.workers.dev';

    document.querySelectorAll('input[name="appearance"]').forEach(r=>{ if(r.value===appearance) r.checked=true; r.addEventListener('change', ()=>{ localStorage.setItem('websearch-theme', r.value); }) });
    document.getElementById('openNewToggle').checked = openNew === 'on';
    document.getElementById('openNewToggle').addEventListener('change', e=>{ localStorage.setItem('websearch-open-new', e.target.checked ? 'on' : 'off' ); });

    document.getElementById('suggestionsToggle').checked = suggestionsOn;
    document.getElementById('suggestionsToggle').addEventListener('change', e=>{ localStorage.setItem('websearch-suggestions', e.target.checked ? 'on':'off'); });

    const backendUrl = document.getElementById('backendUrl'); backendUrl.value = backend;
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const val = backendUrl.value.trim(); if(val) { localStorage.setItem('websearch-backend', val); window.__websearch_setBackend && window.__websearch_setBackend(val); alert('Saved'); }
    });
  </script>
</body>
</html>
