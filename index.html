<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="WebSearch — a clean, private way to search the web.">
  <title>WebSearch</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" aria-label="WebSearch navigation">
    <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8.1 3.8c0-.5-.1-1-.2-1.5l1.8-1.4-1.8-3.1-2.1.9c-.8-.7-1.7-1.2-2.7-1.5L14.8 3h-3.6l-.3 2.4c-1 .3-1.9.8-2.7 1.5l-2.1-.9-1.8 3.1 1.8 1.4c-.1.5-.2 1-.2 1.5s.1 1 .2 1.5l-1.8 1.4 1.8 3.1 2.1-.9c.8.7 1.7 1.2 2.7 1.5l.3 2.4h3.6l.3-2.4c1-.3 1.9-.8 2.7-1.5l2.1.9 1.8-3.1-1.8-1.4c.1-.5.2-1 .2-1.5Z"/>
      </svg>
    </button>
  </header>

  <main class="home" id="homeView">
    <section class="hero" aria-labelledby="brandName">
      <button class="brand" id="homeButton" type="button" aria-label="WebSearch home">
        <img src="/favicon.ico" alt="" class="brand-mark">
        <span id="brandName">WebSearch</span>
      </button>

      <form class="search-form" id="searchForm" role="search">
        <div class="search-shell" id="searchShell">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.7"></circle>
            <path d="m16 16 5 5"></path>
          </svg>

          <input
            id="searchInput"
            name="q"
            type="search"
            inputmode="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search the web..."
            aria-label="Search the web"
          >

          <button class="clear-button" id="clearButton" type="button" aria-label="Clear search" title="Clear search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 7 10 10M17 7 7 17"></path>
            </svg>
          </button>

          <button class="submit-button" type="submit" aria-label="Search" title="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.7"></circle>
              <path d="m16 16 5 5"></path>
            </svg>
          </button>
        </div>

        <div class="suggestions" id="suggestions" hidden></div>
      </form>
    </section>
  </main>

  <main class="results-view" id="resultsView" hidden>
    <div class="results-topbar">
      <button class="results-brand" id="resultsHomeButton" type="button" aria-label="WebSearch home">
        <img src="/favicon.ico" alt="" class="results-brand-mark">
        <span>WebSearch</span>
      </button>

      <form class="results-search-form" id="resultsSearchForm" role="search">
        <div class="search-shell results-search-shell">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.7"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
          <input id="resultsInput" name="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search the web">
          <button class="clear-button" id="resultsClearButton" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
          </button>
          <button class="submit-button" type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 5 5"></path></svg>
          </button>
        </div>
      </form>

      <button class="icon-button" id="resultsSettingsButton" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8.1 3.8c0-.5-.1-1-.2-1.5l1.8-1.4-1.8-3.1-2.1.9c-.8-.7-1.7-1.2-2.7-1.5L14.8 3h-3.6l-.3 2.4c-1 .3-1.9.8-2.7 1.5l-2.1-.9-1.8 3.1 1.8 1.4c-.1.5-.2 1-.2 1.5Z"/></svg>
      </button>
    </div>

    <nav class="result-tabs" aria-label="Search type">
      <button class="tab active" type="button" data-type="web">Web</button>
      <button class="tab" type="button" data-type="images">Images</button>
      <button class="tab" type="button" data-type="news">News</button>
      <button class="tab" type="button" data-type="videos">Videos</button>
    </nav>

    <section class="results-content" aria-live="polite">
      <div id="resultsStatus" class="results-status"></div>
      <div id="resultsList" class="results-list"></div>
    </section>
  </main>

  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-button close-settings" id="closeSettingsButton" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
        </button>
      </div>

      <div class="settings-section">
        <h3>Appearance</h3>
        <label class="setting-row">
          <span>Theme</span>
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>

      <div class="settings-section">
        <h3>Search</h3>
        <label class="setting-row">
          <span>Open results in a new tab</span>
          <input id="newTabToggle" type="checkbox">
        </label>
        <label class="setting-row">
          <span>Search suggestions</span>
          <input id="suggestionsToggle" type="checkbox" checked>
        </label>
      </div>

      <div class="settings-section about">
        <h3>About WebSearch</h3>
        <p>WebSearch is designed to provide a clean, privacy-focused search experience. Provider and privacy details can be explained here without cluttering the main search page.</p>
        <p class="backend-note">Search endpoint: <code>/api/search?q=...</code></p>
      </div>
    </section>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/script.js"></script>
</body>
</html>
