<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebSearch - A modern, clean search engine interface">
    <meta name="theme-color" content="#f5f5f3">
    <title>WebSearch</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Homepage View -->
    <div id="homepage-view" class="view active">
        <header class="homepage-header">
            <a href="settings.html" class="settings-icon" title="Settings" aria-label="Open settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m6.08 0l4.24-4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m6.08 0l4.24 4.24"></path>
                </svg>
            </a>
        </header>

        <main class="homepage-main">
            <div class="logo-container">
                <img src="favicon.ico" alt="WebSearch" class="homepage-logo">
            </div>

            <div class="search-section">
                <form id="homepage-form" class="search-form" role="search">
                    <div class="search-box">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <input
                            type="text"
                            id="homepage-search-input"
                            class="search-input"
                            placeholder="Search the web..."
                            autocomplete="off"
                            aria-label="Search"
                            spellcheck="false">
                        <button id="homepage-clear-btn" class="clear-btn" aria-label="Clear search" type="button" style="display: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <div id="homepage-suggestions" class="suggestions-container" role="listbox" style="display: none;"></div>
                </form>
            </div>
        </main>
    </div>

    <!-- Results View -->
    <div id="results-view" class="view" style="display: none;">
        <header class="results-header">
            <div class="results-header-left">
                <a href="index.html" class="results-logo" aria-label="WebSearch home">
                    <img src="favicon.ico" alt="WebSearch" class="results-logo-img">
                </a>
            </div>

            <form id="results-form" class="results-search-form" role="search">
                <div class="results-search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input
                        type="text"
                        id="results-search-input"
                        class="results-search-input"
                        placeholder="Search..."
                        autocomplete="off"
                        aria-label="Search"
                        spellcheck="false">
                    <button id="results-clear-btn" class="clear-btn" aria-label="Clear search" type="button" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div id="results-suggestions" class="suggestions-container" role="listbox" style="display: none;"></div>
            </form>

            <a href="settings.html" class="settings-icon" title="Settings" aria-label="Open settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m6.08 0l4.24-4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m6.08 0l4.24 4.24"></path>
                </svg>
            </a>
        </header>

        <nav class="results-tabs" aria-label="Search type">
            <button class="tab-btn active" data-type="web" type="button">Web</button>
            <button class="tab-btn" data-type="images" type="button">Images</button>
            <button class="tab-btn" data-type="news" type="button">News</button>
            <button class="tab-btn" data-type="videos" type="button">Videos</button>
        </nav>

        <main class="results-content" aria-live="polite" aria-busy="false">
            <div id="results-status" class="results-status"></div>
            <div id="results-container" class="results-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
